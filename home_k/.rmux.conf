# Github: https://github.com/Karmenzind/dotfiles-and-scripts
# Cross-platform usage and verification: docs/rmux.md
# Windows compatibility evidence: docs/windows-rmux.md

# This standalone configuration is shared by Linux, macOS, and Windows.
# Preserve the same key bindings and user-visible behavior on every platform,
# including prefix handling, pane/window creation, current-directory
# inheritance, copy mode, navigation, resizing, and synchronized panes.
#
# Keep this file standalone: the shared tmux file contains Unix-only TPM
# plugins, shell jobs, clipboard commands, and tmux-specific terminal
# assumptions. RMUX parses substantially more tmux syntax, but those external
# integrations are not portable across all three platforms.
set-option -g prefix C-a
bind-key C-a send-prefix
unbind-key C-b

set-option -g history-limit 5000
set-option -g automatic-rename off
set-option -g status-keys vi
set-option -g mode-keys vi
set-option -g mouse on
bind-key M set-option -g mouse \; display-message "[Toggled] Mouse: #{?mouse,ON,OFF}"
set-option -g escape-time 10
set-option -g repeat-time 600
set-option -g focus-events on
set-option -g base-index 0
set-option -g pane-base-index 0

set-option -g status-position bottom
set-option -g status-style bg=default,fg=cyan
set-option -g status-left-length 24
set-option -g status-right-length 48
set-option -g status-left "#[fg=cyan,bold]#{?selection_present, ✦ VISUAL , 🪟 #S }#[default]"
set-option -g status-right "#[fg=colour240]╱ #[fg=cyan,italics]🖥 #{host_short} #[fg=colour240]│ #[fg=cyan,bold]◷ %H:%M #[fg=colour240]│ #[fg=cyan,italics]%d %b #[default]"
set-option -g status-justify absolute-centre
set-option -g window-status-separator " "
set-option -g window-status-style fg=colour12,italics
set-option -g window-status-current-style fg=white,bg=red,bold,italics
set-option -g window-status-format " ◇ #I·#W "
# A dark trailing half-block suggests a small card shadow without changing the
# existing red active-window colour.
set-option -g window-status-current-format "#[fg=red,bg=default]▌#[fg=white,bg=red,bold,italics] ◆ #I·#W #[fg=colour240,bg=default]▐"
set-option -g pane-border-status bottom
set-option -g pane-border-format " #{?pane_active,◆,◇} #{pane_index} │ #{pane_current_command} "
set-option -g pane-border-style fg=colour240,italics
set-option -g pane-active-border-style fg=colour14,bold,italics
# RMUX 0.10 renders the copy-mode selection with mode-style. Keep the VISUAL
# status marker as an additional mode indicator.
set-option -g mode-style bg=yellow,fg=black

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
bind-key -r C-h select-window -t :-
bind-key -r C-l select-window -t :+
bind-key -r H resize-pane -L 2
bind-key -r J resize-pane -D 2
bind-key -r K resize-pane -U 2
bind-key -r L resize-pane -R 2
bind-key C-s set-window-option synchronize-panes
bind-key R source-file -F "#{config_files}" \; display-message "RMUX config reloaded"

# Let RMUX select the platform's native user shell: $SHELL on Unix and the
# native Windows default. Hard-coding pwsh.exe prevents Linux and macOS panes
# from starting and is unnecessary on RMUX 0.10.
set-option -g default-terminal xterm-256color
set-option -g update-environment "COLORTERM DISPLAY SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION WAYLAND_DISPLAY WINDOWID XAUTHORITY TERM_PROGRAM"

# Keep the 0.8 Ctrl+D workaround until physical-console input is verified on
# Windows 0.10; send-keys exercises a different path and is not sufficient
# evidence. USERPROFILE is the stable platform marker inherited by native
# Windows servers. Use runtime if-shell because RMUX 0.10.0 evaluates parse-time
# %if directives before importing the server environment.
if-shell -F '#{USERPROFILE}' 'bind-key -n C-d send-keys -H 04'

# On Unix RMUX tracks the foreground process directory; on Windows OSC 7 from
# the PowerShell prompt keeps pane_current_path current. Explicit -c bindings
# make new panes and windows inherit that tracked directory on every platform.
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"

# RMUX 0.10 retains the 0.9.1 cached-mouse-coordinate fix for keyboard
# selections. Use the native commands; select-line correctly expands
# soft-wrapped logical lines, unlike the 0.9.0 selection-mode workaround.
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi V send -X select-line
bind-key -T copy-mode-vi C-v send -X rectangle-toggle
bind-key -T copy-mode-vi y send -X copy-selection
